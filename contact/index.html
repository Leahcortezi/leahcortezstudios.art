<body>

    <!-- Navigation -->

            <a href="../index.html" class="logo">

<li><a href="index.html">CONTACT</a></li>

                <img src="../icons/flower.svg" alt="Open navigation menu" class="hamburger-icon" loading="lazy">
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="contact-page">
        <div class="contact-container">
            <h1>Contact</h1>
            <p class="contact-intro">Ready to bring your vision to life? Let's collaborate on something beautiful together. Whether you're looking for custom artwork, design services, or have questions about my work, I'd love to hear from you.</p>

            <!-- Contact Form -->
            <form id="contact-form" class="contact-form" action="https://formsubmit.co/contact@leahcortezstudios.art" method="POST">

                <input type="hidden" name="_subject" value="New message from Leah Cortez Studios contact form">
                <input type="hidden" name="_next" value="https://leahcortezstudios.art/contact/thanks.html">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_template" value="table">

                <!-- Standard Form Fields -->
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="inquiry-type">I'm contacting about...</label>
                    <select id="inquiry-type" name="inquiry_type" required>
                        <option value="">-- Select an option --</option>
                        <option value="Purchase">Purchase / Print Order</option>
                        <option value="Commission">Custom Commission</option>
                        <option value="Collaboration">Collaboration</option>
                        <option value="Press">Press / Media</option>
                        <option value="Other">Other Inquiry</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                </div>

                <!-- Honeypot Field for Spam Protection (hidden from users) -->
                <div class="form-group honeypot">
                    <label for="honeypot">Do not fill this out</label>
                    <input type="text" id="honeypot" name="honeypot" tabindex="-1" autocomplete="off">
                </div>

                <!-- Simple Math CAPTCHA -->
                <div class="form-group captcha">
                    <label for="captcha-answer" id="captcha-question">What is 5 + 3?</label>
                    <input type="number" id="captcha-answer" name="captcha-answer" required>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn">Send Message</button>
            </form>

        </div>
    </main>

    <!-- Footer -->
    <footer class="main-footer">
        <div class="footer-content">
            <img src="../images/logo/logo3.png" alt="Leah Cortez Studios logo" class="footer-logo" loading="lazy">
            <p class="copyright">Leah Cortez © <span id="copyright-year">2026</span></p><script>document.getElementById("copyright-year").textContent = new Date().getFullYear();</script>
        </div>
    </footer>

    <script src="../scripts/main.js" defer></script>
